<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería Trigal de Lima - Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">

  <div class="container" style="max-width: 500px;">
    <h3 class="mt-2">Panadería Trigal de UCH</h3>
    <img src="favicon.png">
    <p class="text-muted">Cotizador de pedidos</p>

    <form id="formPedido">

      <!-- Nombre -->
      <div class="mb-3">
        <label class="form-label">Nombre del cliente:</label>
        <input type="text" class="form-control" id="nombre">
        <span id="error-nombre" class="text-danger small"></span>
      </div>

      <!-- Correo -->
      <div class="mb-3">
        <label class="form-label">Correo electrónico:</label>
        <input type="email" class="form-control" id="email">
        <span id="error-email" class="text-danger small"></span>
      </div>

      <!-- Fecha -->
      <div class="mb-3">
        <label class="form-label">Fecha de entrega:</label>
        <input type="date" class="form-control" id="fecha">
        <span id="error-fecha" class="text-danger small"></span>
      </div>

      <!-- Modalidad -->
      <div>
        <label class="form-label">Modalidad de entrega:</label>
        <select class="form-select" id="modalidad">
          <option value="retiro">Retiro en tienda (S/ 0.00)</option>
          <option value="reparto">Reparto a domicilio (+ S/ 8.00)</option>
        </select>
      </div>

      <!-- Produos generados con bucle -->
      <div>
        <label class="form-label"><b>Productos (cantidad de 1 a 10):</b></label>
        <div id="contenedor-productos"></div>
        <span id="error-productos" class="text-danger small"></span>
      </div>

      <!-- Totales -->
      <div class="card p-3 mb-3 bg-white">
        <div>Subtotal: S/ <span id="ver-subtotal">0.00</span></div>
        <div>Descuento (10% si >= 100): - S/ <span id="ver-descuento">0.00</span></div>
        <div>Reparto: S/ <span id="ver-reparto">0.00</span></div>
        <div class="fw-bold fs-5 mt-1">Total: S/ <span id="ver-total">0.00</span></div>
      </div>

      <!-- Botones -->
      <button type="submit" class="btn btn-primary">Enviar pedido</button>
      <button type="button" id="btn-limpiar" class="btn btn-secondary">Limpiar</button>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
