<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinica Salud Centro - Citas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">

  <div class="container" style="max-width: 500px;">
    <h3 class="mt-2">Consultorio Salud Centro</h3>
    <p class="text-muted">Solicitud de citas medicas</p>

    <form id="formCita">
      
      <!-- Nombre -->
      <div class="mb-3">
        <label class="form-label">Nombre completo:</label>
        <input type="text" class="form-control" id="nombre">
        <span id="error-nombre" class="text-danger small"></span>
      </div>

      <!-- Correo -->
      <div class="mb-3">
        <label class="form-label">Correo electrónico:</label>
        <input type="email" class="form-control" id="email">
        <span id="error-email" class="text-danger small"></span>
      </div>

      <!-- Especialidad -->
      <div class="mb-3">
        <label class="form-label">Especialidad:</label>
        <select class="form-select" id="especialidad">
          <option value="">-- Seleccionar especialidad --</option>
          <option value="Consulta general">Consulta general</option>
          <option value="Odontología">Odontología</option>
          <option value="Nutrición">Nutrición</option>
        </select>
        <span id="error-especialidad" class="text-danger small"></span>
      </div>

      <!-- Fecha -->
      <div class="mb-3">
        <label class="form-label">Fecha de atención:</label>
        <input type="date" class="form-control" id="fecha">
        <span id="error-fecha" class="text-danger small"></span>
      </div>

      <!-- Horario -->
      <div class="mb-3">
        <label class="form-label">Horario:</label>
        <select class="form-select" id="horario">
          <!-- se llena desde script.js -->
        </select>
        <span id="error-horario" class="text-danger small"></span>
      </div>

      <!-- Botones -->
      <button type="submit" class="btn btn-primary">Enviar solicitud</button>
      <button type="button" id="btn-limpiar" class="btn btn-secondary">Limpiar</button>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
