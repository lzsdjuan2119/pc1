<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmacion de Cita</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container" style="max-width: 500px;">
    <h3 class="mt-3">Confirmación de Cita</h3>

    <!-- Si entra directo sin datos -->
    <div id="sin-datos" class="d-none">
      <div class="alert alert-danger mt-3">
        No se encontraron datos de la cita. Debe llenar el formulario primero.
      </div>
      <a href="cita.html" class="btn btn-primary">Volver al formulario</a>
    </div>

    <!-- Si tiene datos -->
    <div id="con-datos" class="d-none">
      <p class="mt-3">Revise los datos de su solicitud:</p>

      <ul class="list-group mb-3">
        <li class="list-group-item"><b>Nombre:</b> <span id="resumen-nombre"></span></li>
        <li class="list-group-item"><b>Correo:</b> <span id="resumen-email"></span></li>
        <li class="list-group-item"><b>Especialidad:</b> <span id="resumen-especialidad"></span></li>
        <li class="list-group-item"><b>Fecha:</b> <span id="resumen-fecha"></span></li>
        <li class="list-group-item"><b>Horario:</b> <span id="resumen-horario"></span></li>
      </ul>

      <a href="cita.html" class="btn btn-warning">Corregir solicitud</a>
      <button type="button" id="btn-confirmar" class="btn btn-success">Confirmar cita</button>

      <div id="mensaje-exito" class="alert alert-success mt-3 d-none">
        Cita confirmada con éxito.
      </div>
    </div>
  </div>

  <script src="js/confirmacion.js"></script>
</body>
</html>
