<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinica UCH - Citas</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container" style="max-width: 500px;">
    <img src="favicon.png" alt="Favicon" class="img-fluid">
    <h3 class="mt-3">Clinica UCH</h3>
    <p>Formulario de solicitud de cita</p>

    <form id="formCita">
      
      <!-- Nombre -->
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo:</label>
        <input type="text" class="form-control" id="nombre" name="nombre">
        <span id="error-nombre" class="error"></span>
      </div>
      <!-- Apellido -->
      <div class="mb-3">
        <label for="apellido" class="form-label">Apellido completo:</label>
        <input type="text" class="form-control" id="apellido" name="apellido">
        <span id="error-apellido" class="error"></span>
      </div>
      <!-- Correo -->
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico:</label>
        <input type="email" class="form-control" id="email" name="email">
        <span id="error-email" class="error"></span>
      </div>

      <!-- Especialidad -->
      <div class="mb-3">
        <label for="especialidad" class="form-label">Especialidad:</label>
        <select class="form-select" id="especialidad" name="especialidad">
          <option value="">-- Seleccionar --</option>
          <option value="Consulta general">Consulta general</option>
          <option value="Odontología">Odontología</option>
          <option value="Nutrición">Nutrición</option>
        </select>
        <span id="error-especialidad" class="error"></span>
      </div>

      <!-- Fecha -->
      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha:</label>
        <input type="date" class="form-control" id="fecha" name="fecha">
        <span id="error-fecha" class="error"></span>
      </div>

      <!-- Horario -->
      <div class="mb-3">
        <label for="horario" class="form-label">Horario:</label>
        <select class="form-select" id="horario" name="horario">
          <!-- Se llena desde JS -->
        </select>
        <span id="error-horario" class="error"></span>
      </div>

      <!-- Botones -->
      <button type="submit" class="btn btn-primary">Enviar solicitud</button>
      <button type="button" id="btn-limpiar" class="btn btn-secondary">Limpiar</button>

    </form>
  </div>

  <script src="js/cita.js"></script>
</body>
</html>
